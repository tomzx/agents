<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDLC, an interactive guide</title>
<meta name="description" content="An interactive introduction to the SDLC skill: a software development lifecycle encoded as composable agent skills.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050c15;
    --bg-2: #0a1626;
    --panel: rgba(17, 30, 49, 0.72);
    --panel-2: rgba(12, 23, 39, 0.86);
    --panel-solid: #101d30;
    --border: rgba(104, 148, 196, 0.22);
    --border-soft: rgba(104, 148, 196, 0.13);
    --text: #eaf2fb;
    --muted: #9db0c6;
    --muted-2: #6f8399;
    --accent: #4fd1c5;
    --accent-2: #f6ad55;
    --accent-3: #6ea8fe;
    --accent-dim: rgba(79, 209, 197, 0.13);
    --accent-2-dim: rgba(246, 173, 85, 0.12);
    --danger: #fc8181;
    --ok: #68d391;
    --radius: 14px;
    --shadow: 0 20px 44px -28px rgba(0, 0, 0, 0.85);
    --shadow-lg: 0 42px 90px -52px rgba(0, 0, 0, 0.9);
    --sidebar: 292px;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.62;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* Ambient aurora + dot grid */
  body::before {
    content: "";
    position: fixed;
    inset: -25%;
    z-index: -2;
    background:
      radial-gradient(44rem 30rem at 8% -10%, rgba(79, 209, 197, 0.16), transparent 62%),
      radial-gradient(38rem 26rem at 104% 4%, rgba(246, 173, 85, 0.10), transparent 60%),
      radial-gradient(52rem 42rem at 62% 118%, rgba(110, 168, 254, 0.13), transparent 62%);
    animation: drift 38s ease-in-out infinite alternate;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image: radial-gradient(rgba(150, 190, 235, 0.055) 1px, transparent 1.4px);
    background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(120% 90% at 50% 0%, #000 35%, transparent 100%);
    mask-image: radial-gradient(120% 90% at 50% 0%, #000 35%, transparent 100%);
  }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to { transform: translate3d(2.2%, 1.6%, 0) scale(1.07); }
  }
  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
    * { scroll-behavior: auto !important; }
  }

  ::selection { background: rgba(79, 209, 197, 0.3); color: #ffffff; }

  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(104, 148, 196, 0.24); border: 3px solid transparent; background-clip: content-box; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(79, 209, 197, 0.5); background-clip: content-box; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  code {
    font-family: var(--mono);
    font-size: 0.84em;
    letter-spacing: -0.01em;
    color: var(--accent-2);
    background: rgba(246, 173, 85, 0.09);
    border: 1px solid rgba(246, 173, 85, 0.16);
    border-radius: 6px;
    padding: 0.1em 0.42em;
    white-space: nowrap;
  }
  h1, h2, h3, h4 { line-height: 1.18; margin: 0 0 0.5em; font-weight: 700; letter-spacing: -0.022em; }
  h1 { font-size: clamp(2rem, 4.2vw, 3rem); font-weight: 800; }
  h2 { font-size: clamp(1.4rem, 2.6vw, 1.95rem); }
  h3 { font-size: 1.06rem; letter-spacing: -0.012em; }
  p { margin: 0 0 1em; }
  ul { margin: 0 0 1em; padding-left: 1.15em; }
  li { margin-bottom: 0.4em; }
  strong, b { font-weight: 650; }

  /* ---------- Layout ---------- */
  .app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }

  .sidebar {
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    padding: 26px 18px;
    border-right: 1px solid var(--border-soft);
    background: linear-gradient(180deg, rgba(9, 19, 32, 0.86), rgba(5, 12, 21, 0.9));
    backdrop-filter: blur(14px) saturate(1.2);
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    min-width: 0;
    z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 2px 4px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    background: linear-gradient(140deg, #6ee7da, #2f9e8f 70%);
    display: grid; place-items: center;
    color: #032018; font-weight: 800; font-size: 0.66rem; letter-spacing: 0.02em;
    box-shadow: 0 0 0 1px rgba(79, 209, 197, 0.45), 0 10px 26px rgba(79, 209, 197, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .brand b { display: block; font-size: 0.98rem; letter-spacing: -0.02em; }
  .brand span { display: block; font-size: 0.72rem; color: var(--muted-2); }

  .nav { display: flex; flex-direction: column; gap: 3px; position: relative; }
  .nav a {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 11px; border-radius: 10px;
    color: var(--muted); font-size: 0.9rem; font-weight: 500;
    text-decoration: none; border: 1px solid transparent; position: relative;
    transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.18s;
  }
  .nav a:hover { background: rgba(79, 209, 197, 0.07); color: var(--text); text-decoration: none; transform: translateX(2px); }
  .nav a.active {
    background: linear-gradient(90deg, rgba(79, 209, 197, 0.16), rgba(79, 209, 197, 0.03));
    color: #c9fff8; border-color: rgba(79, 209, 197, 0.32);
    box-shadow: inset 3px 0 0 var(--accent), 0 10px 30px -18px rgba(79, 209, 197, 0.9);
  }
  .nav a .dot {
    width: 20px; height: 20px; flex: none; border-radius: 50%;
    border: 1px solid var(--border); display: grid; place-items: center;
    font-size: 0.6rem; font-family: var(--mono); color: var(--muted-2);
    transition: all 0.18s;
  }
  .nav a.active .dot { border-color: var(--accent); color: #032018; background: var(--accent); box-shadow: 0 0 14px rgba(79, 209, 197, 0.6); }
  .nav a.done .dot { border-color: var(--ok); color: var(--ok); }
  .nav a.done .dot::after { content: "\2713"; }
  .nav a.done .dot span { display: none; }
  .sidebar-foot { margin-top: auto; font-size: 0.73rem; color: var(--muted-2); line-height: 1.55; padding: 0 4px; }

  .main { min-width: 0; padding: 52px clamp(20px, 5vw, 68px) 100px; }
  .view { max-width: 1080px; margin: 0 auto; animation: fade 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

  /* Scroll progress bar */
  .progress {
    position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60;
    transform-origin: 0 50%; transform: scaleX(0);
    background: linear-gradient(90deg, var(--accent), var(--accent-3) 60%, var(--accent-2));
    box-shadow: 0 0 18px rgba(79, 209, 197, 0.55);
  }

  .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px; font-weight: 600;
  }
  .kicker::before { content: ""; width: 26px; height: 1px; background: linear-gradient(90deg, var(--accent), transparent); }
  .lede { font-size: 1.09rem; color: var(--muted); max-width: 66ch; }

  /* ---------- Reusable bits ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; font-size: 0.78rem; color: var(--muted);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  .pill b { color: var(--accent); font-weight: 700; }
  .pill.amber b { color: var(--accent-2); }

  .grid { display: grid; gap: 16px; }
  .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 900px) { .cols-2, .cols-3 { grid-template-columns: 1fr; } }

  .card {
    position: relative;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.028), rgba(255, 255, 255, 0) 42%), var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 19px 21px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.035);
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .card h3 { color: var(--accent); margin-bottom: 8px; }
  .card p:last-child { margin-bottom: 0; }
  .card p, .card li { color: var(--muted); font-size: 0.93rem; }
  .card.hoverable:hover {
    border-color: rgba(79, 209, 197, 0.45);
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg), 0 0 0 1px rgba(79, 209, 197, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(140deg, #62dccf, #35a99c);
    color: #032018; border: none;
    border-radius: 10px; padding: 10px 17px; font-size: 0.9rem; font-weight: 650;
    font-family: inherit; cursor: pointer; letter-spacing: -0.01em;
    box-shadow: 0 12px 28px -14px rgba(79, 209, 197, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    transition: filter 0.16s, transform 0.16s, box-shadow 0.16s;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 18px 34px -14px rgba(79, 209, 197, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
  }
  .btn.ghost:hover { color: var(--text); border-color: rgba(79, 209, 197, 0.5); filter: none; transform: translateY(-1px); }
  .btn.ghost.on { color: var(--accent); border-color: rgba(79, 209, 197, 0.55); background: var(--accent-dim); box-shadow: 0 0 0 1px rgba(79, 209, 197, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
  .btn.small { padding: 7px 13px; font-size: 0.82rem; }
  .btn:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .section-head { margin-bottom: 30px; }
  .section-head h1 { margin-bottom: 12px; }
  .section-head h1, .hero h1 {
    background: linear-gradient(120deg, #ffffff 8%, #d6f6f2 42%, #8fb8e8 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .spacer { flex: 1; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    border: 1px solid transparent;
    border-radius: 22px;
    padding: clamp(30px, 4.4vw, 54px);
    margin-bottom: 30px;
    overflow: hidden;
    background:
      radial-gradient(42rem 24rem at 86% -34%, rgba(79, 209, 197, 0.20), transparent 62%) padding-box,
      linear-gradient(158deg, rgba(20, 35, 56, 0.96), rgba(7, 15, 26, 0.97)) padding-box,
      linear-gradient(135deg, rgba(79, 209, 197, 0.6), rgba(110, 168, 254, 0.22) 46%, rgba(246, 173, 85, 0.5)) border-box;
    box-shadow: 0 46px 90px -56px rgba(79, 209, 197, 0.65), var(--shadow-lg);
  }
  .hero::before {
    content: "";
    position: absolute; width: 340px; height: 340px; right: -90px; top: -150px;
    background: radial-gradient(circle, rgba(79, 209, 197, 0.34), transparent 68%);
    filter: blur(22px);
    animation: float 16s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(160, 200, 240, 0.07) 1px, transparent 1.4px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(90% 80% at 90% 0%, #000, transparent 72%);
    mask-image: radial-gradient(90% 80% at 90% 0%, #000, transparent 72%);
  }
  @keyframes float { from { transform: translateY(-10px); } to { transform: translateY(24px); } }
  @media (prefers-reduced-motion: reduce) { .hero::before { animation: none; } }
  .hero > * { position: relative; z-index: 1; }
  .hero h1 { max-width: 34ch; }
  .hero .row { margin-top: 24px; }
  .hero-cta { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }

  .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 40px; }
  @media (max-width: 720px) { .stat-strip { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 46%), var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 17px 19px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.035);
    transition: border-color 0.2s, transform 0.2s;
  }
  .stat:hover { border-color: rgba(246, 173, 85, 0.4); transform: translateY(-2px); }
  .stat b {
    display: block; font-size: 1.8rem; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em;
    background: linear-gradient(120deg, #ffd9a8, #f6ad55);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .stat span { display: block; margin-top: 4px; font-size: 0.8rem; color: var(--muted); }

  /* ---------- Pipeline ---------- */
  .pipeline-layout { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 980px) { .pipeline-layout { grid-template-columns: 1fr; } }

  .stages { position: relative; display: flex; flex-direction: column; gap: 11px; }
  .stage {
    position: relative;
    display: grid; grid-template-columns: 46px 1fr auto; gap: 15px; align-items: center;
    text-align: left;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.028), transparent 44%), var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: var(--radius); padding: 14px 17px;
    color: var(--text); font-family: inherit; cursor: pointer;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    transition: border-color 0.18s, background 0.18s, opacity 0.25s, transform 0.18s, box-shadow 0.18s;
    width: 100%;
  }
  .stage + .stage::before {
    content: ""; position: absolute; left: 36px; top: -11px; height: 11px; width: 2px;
    background: linear-gradient(180deg, transparent, rgba(104, 148, 196, 0.45)); border-radius: 2px;
  }
  .stage:hover { border-color: rgba(79, 209, 197, 0.5); border-left-color: var(--accent); transform: translateX(3px); }
  .stage.active {
    border-color: rgba(79, 209, 197, 0.6); border-left-color: var(--accent);
    background: linear-gradient(90deg, rgba(79, 209, 197, 0.16), rgba(17, 30, 49, 0.72) 62%);
    box-shadow: 0 20px 50px -30px rgba(79, 209, 197, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .stage.playing { border-color: rgba(246, 173, 85, 0.6); border-left-color: var(--accent-2); box-shadow: 0 20px 50px -30px rgba(246, 173, 85, 0.9); }
  .stage.dim { opacity: 0.38; filter: saturate(0.6); }
  .stage.hit { border-left-color: var(--accent-2); }
  .stage-num {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(150deg, rgba(79, 209, 197, 0.16), rgba(79, 209, 197, 0.05));
    border: 1px solid rgba(79, 209, 197, 0.32);
    color: var(--accent); font-family: var(--mono); font-weight: 700; font-size: 0.98rem;
    transition: all 0.18s;
  }
  .stage.active .stage-num, .stage.playing .stage-num {
    background: linear-gradient(150deg, #6ee7da, #2f9e8f); color: #032018; border-color: transparent;
    box-shadow: 0 0 0 4px rgba(79, 209, 197, 0.14), 0 10px 24px -10px rgba(79, 209, 197, 0.9);
  }
  .stage.playing .stage-num { background: linear-gradient(150deg, #ffd9a8, #e08b2e); box-shadow: 0 0 0 4px rgba(246, 173, 85, 0.16), 0 10px 24px -10px rgba(246, 173, 85, 0.9); }
  .stage-body b { display: block; font-size: 0.99rem; letter-spacing: -0.015em; }
  .stage-body span { display: block; font-size: 0.82rem; color: var(--muted); }
  .stage-flag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.66rem; letter-spacing: 0.09em; text-transform: uppercase; font-weight: 600;
    color: var(--accent-2); border: 1px solid rgba(246, 173, 85, 0.4); border-radius: 999px; padding: 3px 10px;
    background: rgba(246, 173, 85, 0.09); white-space: nowrap;
  }
  .stage-flag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .stage-flag.stop { color: var(--danger); border-color: rgba(252, 129, 129, 0.45); background: rgba(252, 129, 129, 0.1); }

  .detail {
    position: sticky; top: 26px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 30%), var(--panel-2);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; min-height: 220px;
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(10px);
  }
  .detail h2 { font-size: 1.28rem; margin-bottom: 6px; }
  .detail .stage-tag { font-size: 0.8rem; color: var(--accent); margin-bottom: 15px; letter-spacing: 0.01em; }
  .detail .gate {
    position: relative;
    border: 1px solid rgba(246, 173, 85, 0.38); background: linear-gradient(180deg, rgba(246, 173, 85, 0.14), rgba(246, 173, 85, 0.06));
    border-radius: 11px; padding: 12px 14px 12px 16px; font-size: 0.86rem; color: #f6d6ac; margin: 16px 0;
  }
  .detail .gate::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--accent-2); }
  .detail .gate.stop { border-color: rgba(252, 129, 129, 0.42); background: linear-gradient(180deg, rgba(252, 129, 129, 0.14), rgba(252, 129, 129, 0.05)); color: #f8c3c3; }
  .detail .gate.stop::before { background: var(--danger); }
  .detail .gate b { display: block; margin-bottom: 4px; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.68rem; opacity: 0.9; }
  .skill-line { display: grid; grid-template-columns: auto 1fr; gap: 4px 13px; padding: 9px 8px; margin: 0 -8px; border-radius: 9px; border-bottom: 1px dashed var(--border-soft); transition: background 0.15s; }
  .skill-line:hover { background: rgba(79, 209, 197, 0.06); }
  .skill-line:last-child { border-bottom: none; }
  .skill-line code { justify-self: start; align-self: start; }
  .skill-line span { font-size: 0.86rem; color: var(--muted); }
  .artifact-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .artifact-chips code { font-size: 0.77em; }
  .detail .label { display: flex; align-items: center; gap: 8px; font-size: 0.67rem; letter-spacing: 0.17em; text-transform: uppercase; color: var(--muted-2); margin: 20px 0 6px; }
  .detail .label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-soft), transparent); }

  /* ---------- Paths ---------- */
  .scenario-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .path-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 18px 0; }
  .path-step {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent), var(--panel-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px;
    font-family: var(--mono); font-size: 0.8rem; color: var(--text);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  .path-step.gate { border-color: rgba(246, 173, 85, 0.5); color: var(--accent-2); }
  .path-arrow { color: var(--muted-2); font-size: 0.9rem; }

  /* ---------- Artifacts tree ---------- */
  .tree {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 30%), var(--panel-2);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 10px;
    font-family: var(--mono); font-size: 0.85rem;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.035);
  }
  .tree-node { border-radius: 8px; }
  .tree-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); transition: background 0.15s, color 0.15s; }

function renderTree(nodes, pathPrefix) {
  return nodes.map((node) => {
    const path = pathPrefix + node.name;
    const isDir = !!node.children;
    const open = !!state.treeOpen[path];
    const sel = state.treeSel === path ? " selected" : "";
    const tw = isDir ? `<span class="tw">${open ? "&#9662;" : "&#9656;"}</span>` : `<span class="tw"></span>`;
    const row = `<div class="tree-row ${isDir ? "dir" : ""}${sel}" data-action="tree" data-path="${esc(path)}" data-dir="${isDir ? "1" : "0"}" role="button" tabindex="0">${tw}<span class="tree-ico">${icon(isDir ? "folder" : "file")}</span><span>${esc(node.name)}</span></div>`;
    const childPrefix = path.endsWith("/") ? path : path + "/";
    const children = isDir ? `<div class="tree-children ${open ? "" : "collapsed"}">${renderTree(node.children, childPrefix)}</div>` : "";
    return `<div class="tree-node">${row}${children}</div>`;
  }).join("");
}

function findNode(nodes, path, prefix) {
  for (const node of nodes) {
    const p = prefix + node.name;
    if (p === path) return node;
    if (node.children) {
      const childPrefix = p.endsWith("/") ? p : p + "/";
      const found = findNode(node.children, path, childPrefix);
      if (found) return found;
    }
  }
  return null;
}

function renderArtifacts() {
  const node = state.treeSel ? findNode([ARTIFACT_TREE], state.treeSel, "") : ARTIFACT_TREE;
  const detailName = node ? node.name : ARTIFACT_TREE.name;
  const detailDesc = node ? node.desc : ARTIFACT_TREE.desc;
  return `
    <div class="section-head">
      <p class="kicker">Everything is a file</p>
      <h1>Artifacts</h1>
      <p class="lede">The lifecycle lives in a <code>.sdlc/</code> directory, versioned with the code. Expand the tree and click a node to see what it holds.</p>
    </div>
    <div class="pipeline-layout">
      <div class="tree" role="tree">${renderTree([ARTIFACT_TREE], "")}</div>
      <div class="tree-detail">
        <h3>${esc(detailName)}</h3>
        <p style="color:var(--muted)">${fmt(detailDesc || "")}</p>
      </div>
    </div>
    <h2 style="margin-top:40px">Identifiers that link the chain</h2>
    <div class="grid cols-3">
      <div class="card"><h3><code>FEAT-42</code></h3><p>The feature, project-wide. Directory <code>42-notification-system</code> matches issue #42. A <code>p</code>-prefix means pending, no issue yet.</p></div>
      <div class="card"><h3><code>FR-1</code> / <code>NFR-2</code></h3><p>Functional and non-functional requirements, scoped to the feature. Across features, qualify them: <code>FEAT-1-FR-1</code>.</p></div>
      <div class="card"><h3><code>TC-5</code> and tasks</h3><p>Test cases and task numbers, both per-feature and unpadded. They trace a requirement to its test and its implementation task.</p></div>
    </div>
    <h2 style="margin-top:36px">Local-only state, never committed</h2>
    <div class="card">
      <p><code>state.yml</code> and each feature's <code>progress.md</code> are per-machine workflow state. The <code>.sdlc/.gitignore</code> excludes them.
      <code>status-report.html</code> is also local-only. If you commit manually, never add these paths.</p>
    </div>
  `;
}

function renderSkills() {
  const families = ["All", ...Array.from(new Set(SKILLS.map((s) => s[1])))];
  const chips = families.map((f) => {
    const color = FAMILY_COLORS[f];
    const style = color ? ` style="--fam:${color}"` : "";
    const dot = color ? `<i class="fam-dot"></i>` : "";
    return `<button class="btn ghost small ${state.skillFamily === f ? "on" : ""}" data-action="family" data-id="${esc(f)}"${style}>${dot}${esc(f)}</button>`;
  }).join("");
  const q = state.skillQuery.trim().toLowerCase();
  const filtered = SKILLS.filter((s) => {
    if (state.skillFamily !== "All" && s[1] !== state.skillFamily) return false;
    if (!q) return true;
    return (s[0] + " " + s[2] + " " + s[1]).toLowerCase().includes(q);
  });
  const cards = filtered.map(skillCard).join("");
  return `
    <div class="section-head">
      <p class="kicker">${SKILLS.length} skills</p>
      <h1>Skill explorer</h1>
      <p class="lede">Search the skills the pipeline draws on, or filter by family. Every one of these also works standalone.</p>
    </div>
    <input class="search" id="skill-search" type="search" placeholder="Search skills, for example: review, security, merge, mockups" value="${esc(state.skillQuery)}" aria-label="Search skills">
    <div class="family-chips">${chips}</div>
    <p style="color:var(--muted-2);font-size:0.84rem;margin-bottom:14px">${filtered.length} shown</p>
    <div class="skill-grid" id="skill-grid">${cards || '<div class="empty">No skills match that search.</div>'}</div>
  `;
}

function renderStart() {
  const steps = START_STEPS.map((s, i) => `
    <div class="step">
      <div class="step-num">${i + 1}</div>
      <div>
        <h3>${esc(s.title)}</h3>
        <p>${fmt(s.body)}</p>
        ${s.cmds.map((c) => `<div class="cmd"><span>${esc(c)}</span><button class="copy" data-action="copy" data-cmd="${esc(c)}">copy</button></div>`).join("")}
      </div>
    </div>`).join("");
  return `
    <div class="section-head">
      <p class="kicker">From zero to first PR</p>
      <h1>Getting started</h1>
      <p class="lede">Five steps take you from an empty repository to a feature moving through the pipeline.</p>
    </div>
    <div class="steps">${steps}</div>
    <h2 style="margin-top:38px">The rhythm to learn</h2>
    <div class="path-flow">
      <span class="path-step">draft</span><span class="path-arrow">&rarr;</span>
      <span class="path-step">review</span><span class="path-arrow">&rarr;</span>
      <span class="path-step">address findings</span><span class="path-arrow">&rarr;</span>
      <span class="path-step">advance</span>
    </div>
    <p class="lede">Getting comfortable with that loop is most of using the system. If a review says stop at a gate, stopping early is the feature working, not failing.</p>
    <div class="grid cols-2" style="margin-top:24px">
      <div class="card"><h3>Never lose your place</h3><p><code>/sdlc status</code> and <code>/sdlc continue</code> are read-only and safe. Use them liberally.</p></div>
      <div class="card"><h3>Do not skip the reviews</h3><p>The <code>review-*</code> skills are where cheap mistakes get caught. Address findings before advancing.</p></div>
      <div class="card"><h3>Match the path to the work</h3><p>A typo does not need a specification; a new auth flow does. See <a href="#/paths">fast paths</a>.</p></div>
      <div class="card"><h3>Templates are yours</h3><p>Edit <code>.sdlc/templates/</code> to match how your team writes. <code>/update-sdlc-templates</code> merges upstream changes later.</p></div>
    </div>
  `;
}

function renderQuiz() {
  const answered = Object.keys(state.answers).length;
  const correct = Object.values(state.answers).filter((a) => a.correct).length;
  const questions = QUIZ.map((item, qi) => {
    const chosen = state.answers[qi];
    const choices = item.choices.map((c, ci) => {
      let cls = "choice";
      if (chosen) {
        if (ci === item.answer) cls += " correct";
        else if (ci === chosen.pick) cls += " wrong";
      }
      return `<button class="${cls}" data-action="answer" data-q="${qi}" data-c="${ci}" ${chosen ? "disabled" : ""}>${esc(c)}</button>`;
    }).join("");
    const explain = chosen ? `<div class="explain">${esc(item.why)}</div>` : "";
    return `<div class="quiz-q"><h3>${qi + 1}. ${esc(item.q)}</h3><div class="choices">${choices}</div>${explain}</div>`;
  }).join("");
  const summary = answered === QUIZ.length
    ? `<div class="card" style="margin-bottom:16px"><p class="score">Score: ${correct} / ${QUIZ.length}</p><p style="margin:0;color:var(--muted)">${correct === QUIZ.length ? "You have the mental model. Go run /sdlc issue." : "Revisit the pipeline and core ideas, then try again."}</p></div>`
    : `<p style="color:var(--muted-2);font-size:0.86rem;margin-bottom:16px">${answered} of ${QUIZ.length} answered.</p>`;
  return `
    <div class="section-head">
      <p class="kicker">Reinforce</p>
      <h1>Check yourself</h1>
      <p class="lede">Six questions on how the lifecycle behaves. Pick an answer to see the reasoning.</p>
    </div>
    ${summary}
    ${questions}
    <div class="row" style="margin-top:18px">
      <button class="btn ghost small" data-action="reset-quiz">Reset quiz</button>
      <a class="btn ghost small" href="#/start">Back to getting started</a>
    </div>
  `;
}

const RENDERERS = {
  overview: renderOverview,
  pipeline: renderPipeline,
  ideas: renderIdeas,
  paths: renderPaths,
  artifacts: renderArtifacts,
  skills: renderSkills,
  start: renderStart,
  quiz: renderQuiz
};

/* ============================================================
   Render and navigation
   ============================================================ */

function renderNav() {
  const nav = $("#nav");
  nav.innerHTML = SECTIONS.map((s) => {
    const active = state.section === s.id ? " active" : "";
    const done = state.visited.has(s.id) && !active ? " done" : "";
    return `<a href="#/${s.id}" class="${active}${done}"><span class="dot"><span>${s.num}</span></span>${esc(s.label)}</a>`;
  }).join("");
}

function renderPager() {
  const idx = SECTIONS.findIndex((s) => s.id === state.section);
  const prev = SECTIONS[idx - 1];
  const next = SECTIONS[idx + 1];
  const prevHtml = prev
    ? `<a href="#/${prev.id}"><span class="ph">&larr; Previous</span><b>${esc(prev.label)}</b></a>`
    : `<span></span>`;
  const nextHtml = next
    ? `<a class="next" href="#/${next.id}"><span class="ph">Next &rarr;</span><b>${esc(next.label)}</b></a>`
    : `<a class="next" href="#/overview"><span class="ph">Back to</span><b>Overview</b></a>`;
  return `<nav class="pager" aria-label="Section navigation">${prevHtml}${nextHtml}</nav>`;
}

const SECTION_HUES = {
  overview: "#4fd1c5",
  pipeline: "#6ea8fe",
  ideas: "#a78bfa",
  paths: "#f6ad55",
  artifacts: "#38bdf8",
  skills: "#68d391",
  start: "#fb923c",
  quiz: "#f472b6"
};

function renderFooter() {
  return `<footer class="site-foot">
    <span>SDLC guide, generated from <code>skills/sdlc/SKILL.md</code></span>
    <span class="foot-links">
      <a href="https://github.com/tomzx/agents" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/tomzx/agents/blob/main/skills/sdlc/SKILL.md" target="_blank" rel="noopener">SKILL.md</a>
      <a href="https://github.com/tomzx/agents/blob/main/skills/sdlc/references/shared.md" target="_blank" rel="noopener">shared.md</a>
    </span>
  </footer>`;
}

let revealObserver = null;
let revealTimer = null;

function stopReveal() {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
}

function setupReveal() {
  const view = $("#view");
  stopReveal();
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !("IntersectionObserver" in window)) {
    view.classList.remove("revealing");
    return;
  }
  const els = view.querySelectorAll(".card, .stat, .stage, .skill-card, .step, .quiz-q, .tree, .tree-detail");
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add("in");
        revealObserver.unobserve(entry.target);
      }
    });
  }, { rootMargin: "0px 0px -6% 0px", threshold: 0.04 });
  els.forEach((el) => {
    const parent = el.parentElement;
    const idx = parent ? Array.prototype.indexOf.call(parent.children, el) : 0;
    el.style.transitionDelay = Math.min(idx, 9) * 45 + "ms";
    revealObserver.observe(el);
  });
  // Safety net: never leave content hidden if the observer does not fire.
  revealTimer = setTimeout(() => {
    els.forEach((el) => el.classList.add("in"));
    stopReveal();
  }, 1300);
}

function render() {
  const view = $("#view");
  const renderer = RENDERERS[state.section] || renderOverview;
  const changed = state.rendered !== state.section;
  state.rendered = state.section;
  document.documentElement.style.setProperty("--sec", SECTION_HUES[state.section] || "#4fd1c5");
  view.innerHTML = renderer() + renderPager() + renderFooter();
  const head = view.querySelector(".section-head");
  if (head) {
    const sec = SECTIONS.find((s) => s.id === state.section);
    const num = document.createElement("span");
    num.className = "ghost-num";
    num.setAttribute("aria-hidden", "true");
    num.textContent = String(sec ? sec.num : "").padStart(2, "0");
    head.prepend(num);
  }
  if (changed) {
    view.classList.add("revealing");
    setupReveal();
  } else {
    view.classList.remove("revealing");
    stopReveal();
  }
  renderNav();
  updateProgress();
  if (state.section === "skills") {
    const input = $("#skill-search");
    if (input) {
      input.addEventListener("input", (e) => {
        state.skillQuery = e.target.value;
        const grid = $("#skill-grid");
        const q = state.skillQuery.trim().toLowerCase();
        const filtered = SKILLS.filter((s) => {
          if (state.skillFamily !== "All" && s[1] !== state.skillFamily) return false;
          if (!q) return true;
          return (s[0] + " " + s[2] + " " + s[1]).toLowerCase().includes(q);
        });
        grid.innerHTML = filtered.map(skillCard).join("") || '<div class="empty">No skills match that search.</div>';
      });
    }
  }
}

function go(section, opts) {
  stopPlay();
  if (!RENDERERS[section]) section = "overview";
  state.section = section;
  state.visited.add(section);
  // Update the URL best-effort, but never depend on it: in embedded previews
  // (sandboxed iframes, some editors) setting the hash fires no hashchange event,
  // so rendering must happen here rather than in the hashchange listener.
  if (location.hash !== "#/" + section) {
    try { location.hash = "#/" + section; } catch (e) { /* navigation may be blocked */ }
  }
  render();
  if (!opts || !opts.noScroll) {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  const view = $("#view");
  if (view) view.focus({ preventScroll: true });
}

/* ============================================================
   Interactions
   ============================================================ */

function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  state.playing = false;
}

function startPlay() {
  stopPlay();
  state.playing = true;
  let i = PIPELINE.findIndex((s) => s.id === state.stage);
  if (i < 0) i = 0;
  state.stage = PIPELINE[i].id;
  render();
  playTimer = setInterval(() => {
    i += 1;
    if (i >= PIPELINE.length) { stopPlay(); render(); return; }
    state.stage = PIPELINE[i].id;
    render();
  }, 1700);
}

function copyText(text, btn) {
  const done = () => {
    const old = btn.textContent;
    btn.textContent = "copied";
    btn.classList.add("done");
    setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
}

document.addEventListener("click", (e) => {
  // Section links (sidebar nav and pager) navigate directly, so they work even
  // where fragment navigation or hashchange events are unavailable.
  const link = e.target && e.target.closest ? e.target.closest('a[href^="#/"]') : null;
  if (link) {
    e.preventDefault();
    go(link.getAttribute("href").slice(2));
    return;
  }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "go") {
    e.preventDefault();
    go(el.dataset.section);
    return;
  }
  if (action === "select-stage") {
    stopPlay();
    state.stage = el.dataset.id;
    render();
    return;
  }
  if (action === "play") {
    if (state.playing) { stopPlay(); render(); } else { startPlay(); }
    return;
  }
  if (action === "reset-pipeline") {
    stopPlay();
    state.stage = "issue";
    state.scenario = null;
    render();
    return;
  }
  if (action === "select-path") {
    state.scenario = state.scenario === el.dataset.id ? null : el.dataset.id;
    render();
    return;
  }
  if (action === "tree") {
    const path = el.dataset.path;
    if (el.dataset.dir === "1") {
      state.treeOpen[path] = !state.treeOpen[path];
    }
    state.treeSel = path;
    render();
    return;
  }
  if (action === "family") {
    state.skillFamily = el.dataset.id;
    render();
    return;
  }
  if (action === "answer") {
    const qi = Number(el.dataset.q);
    const ci = Number(el.dataset.c);
    if (state.answers[qi]) return;
    state.answers[qi] = { pick: ci, correct: ci === QUIZ[qi].answer };
    render();
    return;
  }
  if (action === "reset-quiz") {
    state.answers = {};
    render();
    return;
  }
  if (action === "copy") {
    copyText(el.dataset.cmd, el);
    return;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.key === "Enter" || e.key === " ") && e.target && e.target.dataset && e.target.dataset.action === "tree") {
    e.preventDefault();
    e.target.click();
    return;
  }
  const idx = SECTIONS.findIndex((s) => s.id === state.section);
  if (e.key === "ArrowRight") { go(SECTIONS[Math.min(idx + 1, SECTIONS.length - 1)].id); }
  else if (e.key === "ArrowLeft") { go(SECTIONS[Math.max(idx - 1, 0)].id); }
  else if (e.key === "Escape") { stopPlay(); render(); }
});

window.addEventListener("hashchange", () => {
  const id = (location.hash || "").replace(/^#\//, "");
  if (RENDERERS[id] && id !== state.section) {
    stopPlay();
    state.section = id;
    state.visited.add(id);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

/* ============================================================
   Scroll progress
   ============================================================ */

const progressEl = document.getElementById("progress");
function updateProgress() {
  const doc = document.documentElement;
  const max = doc.scrollHeight - doc.clientHeight;
  const p = max > 0 ? Math.min(1, Math.max(0, doc.scrollTop / max)) : 0;
  if (progressEl) progressEl.style.transform = "scaleX(" + p + ")";
}
window.addEventListener("scroll", updateProgress, { passive: true });
window.addEventListener("resize", updateProgress);

/* ============================================================
   Boot
   ============================================================ */

(function boot() {
  const id = (location.hash || "").replace(/^#\//, "");
  if (RENDERERS[id]) { state.section = id; state.visited.add(id); }
  render();

  const grain = document.createElement("div");
  grain.className = "grain";
  grain.setAttribute("aria-hidden", "true");
  document.body.appendChild(grain);

  // Subtle pointer spotlight, skipped for reduced-motion users.
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const spot = document.createElement("div");
    spot.className = "spotlight";
    spot.setAttribute("aria-hidden", "true");
    document.body.appendChild(spot);
    let frame = null;
    window.addEventListener("pointermove", (e) => {
      if (frame) return;
      frame = requestAnimationFrame(() => {
        frame = null;
        document.documentElement.style.setProperty("--mx", e.clientX + "px");
        document.documentElement.style.setProperty("--my", e.clientY + "px");
      });
    }, { passive: true });
  }
})();
</script>
</body>
</html>
